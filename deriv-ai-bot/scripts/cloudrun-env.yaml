MODE: "demo"
EXECUTE_TRADES: "true"
PYTHONUNBUFFERED: "1"
TF_CPP_MIN_LOG_LEVEL: "2"
SAVE_TICK_HISTORY: "false"
TICK_HISTORY_COUNT: "200"
# Synthetics + FX majors (session-aware). FX uses 30m CALL/PUT.
SYMBOLS: "R_10,R_25,R_50,R_75,R_100,1HZ10V,1HZ25V,1HZ50V,1HZ75V,1HZ100V,frxEURUSD,frxGBPUSD"
DERIV_API_MODE: "auto"
MAX_OPEN_TRADES: "1"
MAX_STAKE_PCT: "0.5"
MAX_STAKE: "5"
MIN_BALANCE: "5.0"
STAKE_MODE: "flat"
TRADE_CYCLE_SECONDS: "60"
LEARNING_ALWAYS: "true"
LEARNING_PATH: "data/learning_state.json"
ENABLE_MINUTE_ENGINE: "true"
# Short minute horizon for synthetics
MINUTE_DURATION: "2"
# Long-horizon FX rise/fall (30–40 min holds)
FX_MINUTE_DURATION: "30"
MINUTE_MIN_CONFIDENCE: "0.78"
MIN_NET_RETURN: "0.5"
