MODE: "demo"
EXECUTE_TRADES: "true"
PYTHONUNBUFFERED: "1"
TF_CPP_MIN_LOG_LEVEL: "2"
SAVE_TICK_HISTORY: "false"
TICK_HISTORY_COUNT: "500"
# Multi-market exploration (MOR ranks; DeepSeek reweights). Curated, not all Deriv.
# + frxEURUSD/frxGBPUSD for FX session training (soft-skip when weekend-closed)
SYMBOLS: "R_10,R_25,R_50,R_75,R_100,1HZ10V,1HZ25V,1HZ50V,1HZ75V,1HZ100V,BOOM500,BOOM1000,CRASH500,CRASH1000,JD10,JD25,JD50,RDBULL,RDBEAR,frxEURUSD,frxGBPUSD"
DERIV_API_MODE: "auto"
MAX_OPEN_TRADES: "1"
# Risk 0.5–1.5% per trade (flat stake — no martingale)
MAX_STAKE_PCT: "1.0"
MAX_STAKE: "5"
MIN_STAKE: "0.35"
BASE_STAKE: "1.0"
MIN_BALANCE: "5.0"
STAKE_MODE: "flat"
TRADE_CYCLE_SECONDS: "45"
LEARNING_ALWAYS: "true"
LEARNING_PATH: "data/learning_state.json"
# Durable learning across revisions (bucket + SA already provisioned)
LEARNING_GCS_URI: "gs://trading-bots-502712-deriv-learning/learning/"
ENABLE_MINUTE_ENGINE: "true"
MINUTE_DURATION: "2"
# Bootstrap conf floor (cold learning). Raise to 0.80 after ~50 closes.
MINUTE_MIN_CONFIDENCE: "0.72"
MIN_CONFIDENCE: "0.72"
MIN_NET_RETURN: "0.5"

# Session stop-loss 5% / target 1:3 (stop when either hits) — keep flat stake
SESSION_STOP_LOSS_PCT: "5.0"
SESSION_TARGET_RR: "3.0"
SESSION_STOP_ON_TARGET: "true"

# Analytics gates — cold soft until 50 global closes, mature at 100
# Soft floors so first trades can land (still EV/chop gated in engines)
ANALYTICS_GATE: "true"
MIN_PATTERN_STRENGTH: "55"
MIN_PATTERN_CLARITY: "50"
MIN_EDGE_SCORE: "50"
MIN_LIVE_EDGE: "55"
MIN_QUALITY: "50"
MIN_SAMPLE_SIZE: "100"
COLD_START_EXIT_N: "50"
MATURE_SAMPLE_N: "100"
# Extra cold bootstrap flag used by orchestrator risk sizing
COLD_BOOTSTRAP: "true"

# DeepSeek advisor (key via Secret Manager — must be sk-… NOT AIzaSy…)
DEEPSEEK_ENABLED: "true"
DEEPSEEK_MODEL: "deepseek-v4-flash"
DEEPSEEK_BASE_URL: "https://api.deepseek.com"
# Token-efficient: 20 global closes OR 12 on one market|strategy; never on tiny samples
DEEPSEEK_ANALYZE_EVERY: "20"
DEEPSEEK_MIN_SAMPLE: "20"
DEEPSEEK_MIN_PER_SETUP: "12"
